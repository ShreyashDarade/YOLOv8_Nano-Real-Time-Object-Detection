# Default configuration for yolo-nano. Override with `--config my.yaml`
# and/or individual CLI flags (CLI flags win).
model:
  weights: yolov8n.pt      # use yolov8n.yaml to train from scratch
  device: null             # null = auto, "cpu", "0", "mps", ...
  imgsz: 640

train:
  data: coco128.yaml
  epochs: 50
  batch: 16
  project: runs
  name: yolov8n
  seed: 0
  patience: 20

predict:
  conf: 0.25
  iou: 0.7
  max_det: 300

export:
  format: onnx             # onnx, torchscript, openvino, engine, tflite, ...
  half: false
  dynamic: false

realtime:
  source: "0"              # webcam index, video path, or rtsp:// URL
  show: true
  save: null               # path to write annotated video, e.g. out.mp4
