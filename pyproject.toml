[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-nano"
version = "0.1.0"
description = "Train, evaluate, benchmark, export and run real-time object detection with YOLOv8 Nano."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.2",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
yolo-nano = "yolo_nano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
